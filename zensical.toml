[project.theme]
variant = "classic"
custom_dir = "doc/overrides"
language = "custom"
font = false
favicon = "static/favicon.png"
logo = "static/favicon.png"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue grey"
accent = "deep orange"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue grey"
accent = "deep orange"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["lib"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
show_root_heading = true
show_source = false

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
pymdownx.snippets.base_path = ["doc/content"]
pymdownx.snippets.check_paths = true
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

[project.validation]
invalid_links = true
invalid_link_anchors = true

# Populated from Git history by scripts/zensical_build.py, keyed by page URL.
[project.extra.revision_dates]
