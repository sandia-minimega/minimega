    "^doc/content/releases/",
    "^doc/content/training/miniclass/",
]

# Generated self-links are covered by the strict Zensical build.
exclude = [
    "^https://github\\.com/sandia-minimega/minimega/blob/master/\\.github/workflows/docs\\.yml$",
    "^https://sandia-minimega\\.github\\.io/minimega/",
