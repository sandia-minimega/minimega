name: Lint

on:
  # Branches other than master run through pull_request only, so a push to an
  # open pull request starts one run, not two. workflow_dispatch runs a branch
  # that has no pull request.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
      # Only master saves this cache, so pull requests do not fill the cache quota.
      - name: Restore prek cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: prek-cache
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('prek.toml') }}
          restore-keys: prek-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-
      - name: Install prek
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/j178/prek/releases/download/v0.5.10/prek-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate prek config
        run: prek validate-config prek.toml
      - name: Run prek
        env:
          # The hook guards local commits; code on master has already landed.
          PREK_SKIP: ${{ (github.ref == 'refs/heads/master') && 'no-commit-to-branch' || '' }}
        run: prek run --all-files --show-diff-on-failure
      - name: Save prek cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.prek-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: ${{ steps.prek-cache.outputs.cache-primary-key }}
