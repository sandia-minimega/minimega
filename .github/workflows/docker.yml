name: Publish Docker image

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

# One run per pull request or ref, covering the build and the live tests:
# a new commit on a pull request cancels the superseded run, and pushes queue.
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  push-to-ghcr:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
      contents: read
    outputs:
      image: ${{ steps.ref.outputs.image }}
      artifact: ${{ steps.ref.outputs.artifact }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.vendor=Sandia National Laboratories
            org.opencontainers.image.authors=minimega dev team <minimega-dev@sandia.gov>
            org.opencontainers.image.url=https://sandia-minimega.github.io/minimega/
            org.opencontainers.image.documentation=https://sandia-minimega.github.io/minimega/
            org.opencontainers.image.description=minimega is a tool for launching and managing virtual machines
            org.opencontainers.image.licenses=GPL-3.0
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,suffix=,format=short
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          # pull requests can't push, so keep the image locally for the live tests
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Select image for live tests
        id: ref
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          EVENT: ${{ github.event_name }}
        run: |
          # the immutable short-SHA tag identifies exactly this build
          image="$(echo "$TAGS" | grep -E ':[0-9a-f]{7,}$' | head -1)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" != "push" ]]; then
            echo "artifact=minimega-image" >> "$GITHUB_OUTPUT"
          fi
          echo "live tests will use ${image}"
      - name: Export image for live tests
        if: github.event_name != 'push'
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/minimega-image.tar.gz"
      - name: Upload image for live tests
        if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimega-image
          path: ${{ runner.temp }}/minimega-image.tar.gz
          retention-days: 1
          compression-level: 0

  live-tests:
    name: Live tests
    needs: push-to-ghcr
    # The 22-VM run is costly: test pull requests and master, not every branch
    # push. A same-repo pull request gets both events, so this also runs once
    # per commit instead of twice.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/live.yml
    with:
      image: ${{ needs.push-to-ghcr.outputs.image }}
      image-artifact: ${{ needs.push-to-ghcr.outputs.artifact }}
