name: RPM Build
on:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm rpmlint dnsmasq iproute2 isc-dhcp-client libpcap-dev ntfs-3g openssh-client openvswitch-switch qemu-system-x86 qemu-utils

    - name: Build RPM package
      id: rpm
      run: |
        ./packaging/rpm/build.bash

    - name: Check for build files left in the repository
      run: |
        git status --short
        test -z "$(git status --porcelain)"

    - name: Lint RPM package
      run: |
        rpmlint --strict -r packaging/rpm/minimega.rpmlintrc ./packaging/rpm/rpmbuild/RPMS/x86_64/minimega-*.rpm

    - name: Install RPM package in Rocky Linux 9
      run: |
        docker run --rm -v "$PWD/packaging/rpm/rpmbuild/RPMS/x86_64:/rpms:ro" \
          docker.io/rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f \
          bash -euxc 'dnf install -y dnf-plugins-core epel-release
            dnf config-manager --set-enabled crb
            dnf install -y /rpms/minimega-*.rpm
            minimega -version'

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: minimega-rpm
        path: ./packaging/rpm/rpmbuild/RPMS/*
