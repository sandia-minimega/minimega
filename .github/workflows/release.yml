name: Create Draft Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb-build:
    name: Build deb File
    uses: ./.github/workflows/deb.yml
  rpm-build:
    name: Build rpm File
    uses: ./.github/workflows/rpm.yml
  binary-build:
    name: Build Binaries
    uses: ./.github/workflows/build.yml
  build-and-draft:
    name: Build and Draft Release
    needs: [deb-build, rpm-build, binary-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: minimega
          persist-credentials: false
      - name: Get Version
        run: |
          VER=$(cat minimega/VERSION | cut -d'=' -f2)
          echo "version=$VER" >> $GITHUB_ENV
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: temp
        run: |
          ls minimega* -lh
      # `gh release create` cannot create the untagged draft this step makes.
      - name: Create Release  # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        id: create-release
        with:
          draft: true
          prerelease: false
          name: minimega ${{ env.version }}
          tag_name: ${{ inputs.version }}
          files: |
            minimega-binaries/*.tar.gz
            minimega-deb/*.deb
            minimega-rpm/**/*.rpm
            minimega-python-dist/**/*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true
