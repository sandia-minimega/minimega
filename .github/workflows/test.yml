name: Test
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcap-dev

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        env:
          JUNITFILE: junit.xml
        run: ./scripts/test.bash

      # annotate_only needs no checks: write, so it also works for fork pull requests.
      - name: Report test results
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: junit.xml
          annotate_only: true
          detailed_summary: true
          include_skipped: false
          failed_summary_logs: true
          require_tests: true
          fail_on_parse_error: true

      - name: Report coverage
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: |
          {
            echo "## Unit test coverage"
            echo
            ./scripts/coverage.bash coverage.out
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            junit.xml
            coverage.out
            coverage.html

  ovs:
    # TestOVSCapture needs root and a running Open vSwitch, so it skips in the
    # job above.
    name: Run Open vSwitch Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcap-dev openvswitch-switch
          sudo systemctl start openvswitch-switch
          sudo ovs-vsctl show

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        shell: bash
        run: |
          ./scripts/version.bash
          go test -c -race -o "$RUNNER_TEMP/bridge.test" ./internal/bridge
          sudo MINIMEGA_OVS_TEST=1 "$RUNNER_TEMP/bridge.test" -test.run '^TestOVSCapture$' -test.count=1 -test.v | tee "$RUNNER_TEMP/ovs.log"
          # a skipped test, or no test that matches, also exits with 0
          grep -q '^--- PASS: TestOVSCapture ' "$RUNNER_TEMP/ovs.log"
