// vmbetter config for the minimega live test guest (see tests/live/README.md).
//
// Deliberately has no parent: default.conf adds openssh, vim, kernel headers
// and a pile of network tools, and a 360 MB initrd cannot run 22 VMs on one
// CI runner. This is busybox plus what minirouter needs.
//
// run.sh stages the overlay, drops the image's miniccc, minirouter and
// protonuke into overlay/usr/bin, and builds with "vmbetter -branch bookworm
// -O live live.conf".

// +build debian amd64
packages = "linux-image-amd64 kmod xz-utils busybox iproute2 bird dnsmasq-base iptables"

overlay = "overlay"

postbuild = `
	set -e

	# Bundle the modules the guest needs as uncompressed files in
	# /lib/modules/live; etc/init.d/rcS insmods them from /etc/modules.live
	# (busybox insmod cannot read the .ko.xz files Debian ships). Built-in
	# modules print "builtin" and are skipped.
	KVER=$(ls /lib/modules | head -n1)
	MODULES="
		virtio_pci virtio_net virtio_console virtio_blk e1000 e1000e
		ata_piix ahci sd_mod sr_mod usb_storage ehci_pci uhci_hcd xhci_pci
		ip_tables iptable_filter x_tables xt_conntrack nf_conntrack xt_tcpudp
		ipt_REJECT nf_reject_ipv4 xt_state"
	mkdir -p /lib/modules/live
	: > /etc/modules.live
	for mod in $MODULES; do
		modprobe -S "$KVER" --show-depends "$mod" 2>/dev/null || true
	done | while read -r kind path _; do
		[ "$kind" = insmod ] || continue
		name=$(basename "$path"); name=${name%.xz}
		[ -e "/lib/modules/live/$name" ] && continue
		case "$path" in
		*.xz) xz -dc "$path" > "/lib/modules/live/$name" ;;
		*) cp "$path" "/lib/modules/live/$name" ;;
		esac
		echo "$name" >> /etc/modules.live
	done
	echo "bundled $(wc -l < /etc/modules.live) modules" >&2

	# minirouter uses the legacy iptables backend (no nf_tables modules)
	update-alternatives --set iptables /usr/sbin/iptables-legacy
	update-alternatives --set ip6tables /usr/sbin/ip6tables-legacy

	# busybox is init, and supplies sh applets Debian lacks (udhcpc, mdev,
	# ifconfig, route, sysctl, ...). Never shadow a real binary such as ip.
	ln -sf bin/busybox /init
	for applet in $(/bin/busybox --list-full); do
		[ -e "/$applet" ] || [ -L "/$applet" ] || ln -s /bin/busybox "/$applet"
	done

	# minirouter expects miniccc at /miniccc; "router commit" runs
	# "minirouter -u" through miniccc. (An overlay cannot carry these
	# symlinks: vmbetter copies overlays with cp -L.)
	ln -sf /usr/bin/miniccc /miniccc
	ln -sf /usr/bin/minirouter /minirouter

	# Drop the packaging stack and the kernel's initramfs tooling: nothing in the
	# guest uses them, and perl alone is 50 MB of RAM per VM. Only the files go:
	# /boot/vmlinuz stays (linux-image is not purged). dpkg itself goes last.
	dpkg --purge --force-all initramfs-tools initramfs-tools-core klibc-utils \
		libklibc udev linux-base perl perl-modules-5.36 libperl5.36 apt gpgv \
		libapt-pkg6.0 libgnutls30 libkrb5-3 openssl tzdata e2fsprogs cpio \
		xz-utils debconf adduser tar >/dev/null 2>&1 || true
	# perl-base is essential, so dpkg would balk; gconv is iconv charsets
	rm -rf /usr/lib/udev /usr/lib/x86_64-linux-gnu/perl* /usr/share/perl* /usr/lib/apt \
		/usr/bin/perl* /usr/lib/x86_64-linux-gnu/gconv

	# Everything the guest does not use. Only /boot/vmlinuz-* stays: vmbetter
	# copies it out as live.kernel. The initramfs lives in RAM, so every byte
	# here is guest memory.
	rm -rf /lib/modules/"$KVER" /boot/initrd.img* /boot/config-* /boot/System.map-*
	rm -rf /usr/share/doc /usr/share/man /usr/share/locale /usr/share/info /usr/share/lintian
	rm -rf /var/lib/dpkg /var/lib/apt/lists/* /var/cache/apt /var/cache/debconf/*-old /var/log/*
	# fail the build, not the boot, if pruning removed a library
	for bin in /bin/busybox /sbin/ip /usr/sbin/bird /usr/sbin/bird6 /usr/sbin/dnsmasq /usr/sbin/xtables-legacy-multi; do
		if ldd "$bin" | grep 'not found'; then echo "$bin lost a library" >&2; exit 1; fi
	done
	echo "unpacked rootfs: $(du -smx / | cut -f1) MiB" >&2
`
